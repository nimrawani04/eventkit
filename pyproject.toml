[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eventkit"
version = "0.2.0"
description = "Offline, explainable event operations and credential verification"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
eventkit = "eventkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

